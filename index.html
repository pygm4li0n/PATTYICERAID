<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔮 CHONK RAIDS · Wizard Cat Edition</title>

    <!-- ─── Preload both hero images so they arrive before the layout needs them ─── -->
    <link rel="preload" as="image" href="https://i.postimg.cc/RCkvGRqY/Gato-mago-Chonk-Raid-(1).png" fetchpriority="high">
    <link rel="preload" as="image" href="https://i.postimg.cc/prJkhvT8/Gato-mago-Chonk-Raid-(2)-(2).png" fetchpriority="high">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;600;700;900&family=Cinzel:wght@400;600;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --void: #0a0510;
            --deep-purple: #1a0a2e;
            --mid-purple: #2d1b4e;
            --light-purple: #4a2c6d;
            --arcane: #9b59b6;
            --arcane-glow: #c39bd3;
            --gold: #d4af37;
            --bright-gold: #ffd700;
            --pale-gold: #ffe87c;
            --orange: #ff8c00;
            --crimson: #e74c3c;
            --ember: #ff4d6d;
            --emerald: #2ecc71;
            --parchment: #f5e6c8;
        }

        html { height: 100%; }

        body {
            height: 100dvh;
            min-height: 100vh;
            font-family: 'Cinzel', 'Segoe UI', serif;
            overflow: hidden;
            background: var(--void);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* ─── Arcane Background ─────────────────── */
        .bg-arcane {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(circle at 25% 15%, rgba(155, 89, 182, 0.28) 0%, transparent 40%),
                radial-gradient(circle at 75% 55%, rgba(212, 175, 55, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 85%, rgba(255, 140, 0, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 45%, #2d1b4e 0%, #1a0a2e 35%, #0a0510 70%, #020108 100%);
            animation: arcaneShift 14s ease-in-out infinite alternate;
        }
        @keyframes arcaneShift {
            0%   { opacity: 0.9; transform: scale(1); }
            100% { opacity: 1;   transform: scale(1.05); }
        }

        .bg-arcane::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 140vmax; height: 140vmax;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px dashed rgba(212, 175, 55, 0.06);
            box-shadow:
                0 0 120px rgba(155, 89, 182, 0.05),
                inset 0 0 120px rgba(212, 175, 55, 0.03);
            animation: runeSpin 80s linear infinite;
            pointer-events: none;
        }
        @keyframes runeSpin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to   { transform: translate(-50%, -50%) rotate(360deg); }
        }

        #magicCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }
        .active { display: flex; }

        /* ─── Intro ─────────────────────────────── */
        #introScreen { background: transparent; }
        .intro-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .intro-image-slot {
            width: 100%;
            max-width: 400px;
            height: min(50dvh, 400px);
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            flex-shrink: 0;
        }
        .intro-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 50px rgba(155, 89, 182, 0.5))
                    drop-shadow(0 0 90px rgba(212, 175, 55, 0.2));
            border-radius: 24px;
            animation: introFloat 5s ease-in-out infinite;
            will-change: transform;
        }
        @keyframes introFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }
        .intro-loading-wrap {
            width: 80%;
            max-width: 350px;
            flex-shrink: 0;
        }
        .intro-loading-track {
            width: 100%;
            height: 10px;
            background: rgba(155, 89, 182, 0.12);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        .intro-loading-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #9b59b6, #d4af37, #ffd700);
            border-radius: 20px;
            box-shadow: 0 0 28px rgba(212, 175, 55, 0.7);
            transition: width 0.1s linear;
        }
        .intro-loading-text {
            color: rgba(245, 230, 200, 0.95);
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 14px;
            text-align: center;
            font-weight: 900;
            font-family: 'Cinzel', serif;
            text-shadow:
                0 0 10px rgba(212, 175, 55, 0.65),
                0 2px 4px rgba(0, 0, 0, 0.95),
                0 0 2px rgba(0, 0, 0, 1);
        }

        /* ─── Game Wrapper ──────────────────────── */
        .game-wrapper {
            width: 100%;
            max-width: 560px;
            height: 100%;
            max-height: 100dvh;
            padding: 8px 20px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            overflow: hidden;
        }

        .logo-slot {
            width: min(100%, 500px);
            height: clamp(80px, 18dvh, 170px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .game-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 520px;
            padding: 0 4px;
            font-size: 0.9rem;
            color: var(--parchment);
            gap: 8px;
            flex-shrink: 0;
        }
        .info-item {
            background: rgba(20, 8, 38, 0.9);
            backdrop-filter: blur(12px);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.45);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.12);
            white-space: nowrap;
        }
        .info-item .emoji-big {
            font-size: 1.4rem;
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.9))
                    drop-shadow(0 1px 2px rgba(0, 0, 0, 0.7))
                    saturate(1.3) contrast(1.15);
            flex-shrink: 0;
        }
        .info-item .value {
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #ffe87c, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.2em;
            letter-spacing: 0.5px;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.95));
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-item.round-item,
        .info-item.score-item {
            flex: 0 0 auto;
            min-width: 0;
        }
        .info-item.round-item .value,
        .info-item.score-item .value {
            max-width: 85px;
        }

        .info-item.top-scorer-item {
            flex: 1 1 auto;
            min-width: 0;
            background: rgba(255, 215, 0, 0.1);
            border: 1.5px solid rgba(255, 215, 0, 0.55);
            box-shadow: 0 0 24px rgba(255, 215, 0, 0.28), 0 0 55px rgba(255, 180, 0, 0.12);
            animation: topScorerGlow 2.5s ease-in-out infinite;
            padding: 6px 18px;
            justify-content: center;
        }
        @keyframes topScorerGlow {
            0%, 100% { box-shadow: 0 0 24px rgba(255, 215, 0, 0.28), 0 0 55px rgba(255, 180, 0, 0.12); }
            50%      { box-shadow: 0 0 38px rgba(255, 215, 0, 0.55), 0 0 75px rgba(255, 180, 0, 0.3); }
        }
        .info-item.top-scorer-item .emoji-big {
            filter: drop-shadow(0 0 14px rgba(255, 215, 0, 0.95))
                    drop-shadow(0 0 24px rgba(255, 180, 0, 0.6))
                    drop-shadow(0 1px 2px rgba(0, 0, 0, 0.7))
                    saturate(1.3) contrast(1.15);
            font-size: 1.5rem;
            animation: crownBounce 1.8s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes crownBounce {
            0%, 100% { transform: translateY(0); }
            30%      { transform: translateY(-5px); }
            60%      { transform: translateY(0); }
        }
        .info-item.top-scorer-item .value {
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff, #ffe87c, #ffb800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.2em;
            letter-spacing: 0.5px;
            max-width: 170px;
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.95))
                    drop-shadow(0 0 8px rgba(255, 200, 0, 0.5));
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ─── Grid Frame ────────────────────────── */
        .grid-frame {
            width: min(100%, 520px, 68dvh);
            aspect-ratio: 4 / 3;
            max-height: 48dvh;
            background: rgba(26, 10, 46, 0.55);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 16px;
            border: 1px solid rgba(212, 175, 55, 0.18);
            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.65),
                inset 0 0 80px rgba(155, 89, 182, 0.06),
                0 0 40px rgba(212, 175, 55, 0.05);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            height: 100%;
        }

        /* ─── Round Tracker ─────────────────────── */
        .round-tracker {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: min(100%, 520px, 68dvh);
            margin: 4px auto 0 auto;
            gap: 8px;
            padding: 0 6px;
            flex-shrink: 0;
        }
        .tracker-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(155, 89, 182, 0.1);
            border: 2px solid rgba(155, 89, 182, 0.3);
            transition: all 0.3s ease;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
        .tracker-dot.active-crimson {
            background: var(--crimson);
            border-color: #ffd700;
            box-shadow: 0 0 22px var(--crimson);
            transform: scale(1.2);
        }
        .tracker-dot.active-arcane {
            background: var(--arcane);
            border-color: #ffd700;
            box-shadow: 0 0 22px var(--arcane);
            transform: scale(1.2);
        }
        .tracker-dot.active-gold {
            background: var(--bright-gold);
            border-color: #fff;
            box-shadow: 0 0 22px var(--bright-gold);
            transform: scale(1.2);
        }
        .tracker-dot.neutral {
            background: rgba(212, 175, 55, 0.5);
            border-color: rgba(245, 230, 200, 0.6);
            box-shadow: 0 0 16px rgba(212, 175, 55, 0.7);
            transform: scale(1.15);
        }
        .tracker-dot.current {
            border-color: rgba(212, 175, 55, 0.9);
            box-shadow: 0 0 28px rgba(212, 175, 55, 0.7);
            animation: dotPulse 1.2s infinite;
        }
        @keyframes dotPulse {
            0%, 100% { transform: scale(1.2); }
            50%      { transform: scale(1.35); }
        }

        /* ─── Cards ─────────────────────────────── */
        .card {
            perspective: 800px;
            cursor: pointer;
            position: relative;
            min-width: 0;
            min-height: 0;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            border-radius: 20px;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.7);
            will-change: transform;
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-back {
            background: rgba(45, 27, 78, 0.5);
            border: 2px solid rgba(212, 175, 55, 0.3);
            box-shadow: inset 0 0 40px rgba(155, 89, 182, 0.1);
            backdrop-filter: blur(10px);
            z-index: 2;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .card-back::after {
            content: '🔮';
            font-size: clamp(1.4rem, 3.2dvh, 2.8rem);
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.9))
                    drop-shadow(0 0 40px rgba(155, 89, 182, 0.6))
                    drop-shadow(0 1px 3px rgba(0, 0, 0, 0.75))
                    saturate(1.3) contrast(1.15);
            animation: crystalPulse 2.5s ease-in-out infinite;
        }
        @keyframes crystalPulse {
            0%, 100% { transform: scale(1);    opacity: 0.85; }
            50%      { transform: scale(1.12); opacity: 1; }
        }
        .card:hover .card-back {
            border-color: rgba(212, 175, 55, 0.7);
            box-shadow: inset 0 0 60px rgba(155, 89, 182, 0.2), 0 0 32px rgba(212, 175, 55, 0.4);
        }
        .card-front {
            background: rgba(10, 5, 16, 0.85);
            backdrop-filter: blur(12px);
            transform: rotateY(180deg);
            border: 2px solid rgba(212, 175, 55, 0.35);
            padding: 8%;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
            box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.85);
        }

        .card.crimson .card-front {
            border-color: var(--crimson);
            box-shadow: 0 0 22px rgba(231, 76, 60, 0.55), inset 0 0 22px rgba(231, 76, 60, 0.2);
        }
        .card.arcane .card-front {
            border-color: var(--arcane);
            box-shadow: 0 0 22px rgba(155, 89, 182, 0.55), inset 0 0 22px rgba(155, 89, 182, 0.2);
        }
        .card.gold .card-front {
            border-color: var(--bright-gold);
            box-shadow: 0 0 22px rgba(255, 215, 0, 0.55), inset 0 0 22px rgba(255, 215, 0, 0.2);
        }

        .card.crimson .card-front img {
            filter: drop-shadow(0 0 14px rgba(231, 76, 60, 0.95)) drop-shadow(0 0 28px rgba(231, 76, 60, 0.55));
        }
        .card.arcane .card-front img {
            filter: drop-shadow(0 0 14px rgba(155, 89, 182, 0.95)) drop-shadow(0 0 28px rgba(155, 89, 182, 0.55));
        }
        .card.gold .card-front img {
            filter: drop-shadow(0 0 14px rgba(255, 215, 0, 0.95)) drop-shadow(0 0 28px rgba(255, 215, 0, 0.55));
        }

        .card.glow.crimson .card-front {
            border-color: var(--crimson);
            box-shadow: 0 0 55px rgba(231, 76, 60, 0.85), inset 0 0 45px rgba(231, 76, 60, 0.45);
        }
        .card.glow.crimson .card-front img {
            filter: drop-shadow(0 0 22px rgba(231, 76, 60, 1)) drop-shadow(0 0 50px rgba(231, 76, 60, 0.85));
        }
        .card.glow.arcane .card-front {
            border-color: var(--arcane);
            box-shadow: 0 0 55px rgba(155, 89, 182, 0.85), inset 0 0 45px rgba(155, 89, 182, 0.45);
        }
        .card.glow.arcane .card-front img {
            filter: drop-shadow(0 0 22px rgba(155, 89, 182, 1)) drop-shadow(0 0 50px rgba(155, 89, 182, 0.85));
        }
        .card.glow.gold .card-front {
            border-color: var(--bright-gold);
            box-shadow: 0 0 55px rgba(255, 215, 0, 0.85), inset 0 0 45px rgba(255, 215, 0, 0.45);
        }
        .card.glow.gold .card-front img {
            filter: drop-shadow(0 0 22px rgba(255, 215, 0, 1)) drop-shadow(0 0 50px rgba(255, 215, 0, 0.85));
        }

        .card-front img {
            max-width: 84%;
            max-height: 84%;
            object-fit: contain;
        }

        /* ─── Win Message ───────────────────────── */
        .win-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            pointer-events: none;
            z-index: 30;
            opacity: 0;
            letter-spacing: 3px;
            white-space: nowrap;
            color: var(--parchment);
            font-family: 'Grenze Gotisch', serif;
            text-shadow:
                -2px -2px 0 #000, 2px -2px 0 #000,
                -2px 2px 0 #000, 2px 2px 0 #000,
                0 0 60px rgba(0, 0, 0, 0.9),
                0 0 30px rgba(212, 175, 55, 0.6);
        }
        .win-message.show {
            animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .win-message.crimson { color: var(--crimson); }
        .win-message.arcane  { color: var(--arcane-glow); }
        .win-message.gold    { color: var(--bright-gold); }
        @keyframes popIn {
            0%   { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
            40%  { transform: translate(-50%, -50%) scale(1.1) rotate(2deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg);  opacity: 1; }
        }

        /* ─── Leaderboard ───────────────────────── */
        #leaderboardOverlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 2, 12, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #leaderboardOverlay.open { display: flex; }
        .lb-panel {
            background: linear-gradient(170deg, rgba(26, 10, 46, 0.96), rgba(10, 5, 16, 0.98), rgba(20, 8, 40, 0.95));
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 34px;
            padding: 28px 28px 30px;
            max-width: 440px;
            width: 100%;
            max-height: 72dvh;
            overflow-y: auto;
            box-shadow:
                0 0 60px rgba(155, 89, 182, 0.2),
                0 0 120px rgba(212, 175, 55, 0.08),
                0 30px 80px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            position: relative;
            animation: lbIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes lbIn {
            from { transform: scale(0.9); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        .lb-panel h2 {
            text-align: center;
            font-size: 2rem;
            font-family: 'Grenze Gotisch', serif;
            font-weight: 900;
            background: linear-gradient(135deg, #f5e6c8, #d4af37, #ffd700, #f5e6c8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 5px;
            margin-bottom: 18px;
            filter: drop-shadow(0 0 18px rgba(212, 175, 55, 0.6));
            animation: titleShimmer 3s ease-in-out infinite;
        }
        @keyframes titleShimmer {
            0%, 100% { filter: drop-shadow(0 0 18px rgba(212, 175, 55, 0.6)); }
            50%      { filter: drop-shadow(0 0 34px rgba(255, 215, 0, 0.9)); }
        }
        .lb-panel .close-btn {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 1.5rem;
            cursor: pointer;
            color: rgba(212, 175, 55, 0.45);
            background: none;
            border: none;
            transition: 0.25s;
        }
        .lb-panel .close-btn:hover {
            color: #ffd700;
            transform: rotate(90deg) scale(1.2);
            text-shadow: 0 0 22px rgba(255, 215, 0, 0.8);
        }
        .lb-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .lb-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 15px;
            color: rgba(255, 245, 220, 1);
            font-size: 1rem;
            font-weight: 800;
            border-radius: 14px;
            transition: all 0.25s ease;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
        }
        .lb-list li.rank-1 {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 180, 0, 0.08));
            border: 1.5px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 30px rgba(255, 200, 0, 0.25);
        }
        .lb-list li.rank-2 {
            background: linear-gradient(135deg, rgba(192, 210, 230, 0.14), rgba(160, 180, 200, 0.05));
            border: 1.5px solid rgba(180, 200, 220, 0.35);
            box-shadow: 0 0 24px rgba(180, 200, 220, 0.16);
        }
        .lb-list li.rank-3 {
            background: linear-gradient(135deg, rgba(205, 140, 80, 0.18), rgba(180, 110, 50, 0.06));
            border: 1.5px solid rgba(200, 140, 70, 0.45);
            box-shadow: 0 0 24px rgba(200, 140, 70, 0.2);
        }
        .lb-list li.rank-other {
            background: rgba(45, 27, 78, 0.65);
            border: 1px solid rgba(155, 89, 182, 0.3);
        }
        .lb-list li .medal {
            font-size: 1.6rem;
            min-width: 34px;
            text-align: center;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6))
                    saturate(1.3) contrast(1.15);
        }
        .lb-list li .name {
            flex: 1;
            font-weight: 800;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        }
        .lb-list li .score {
            font-weight: 900;
            font-family: 'Cinzel', serif;
            font-size: 1.1em;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff, #ffe87c, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.95));
        }
        .lb-list .lb-loading {
            text-align: center;
            color: rgba(255, 220, 120, 0.95);
            padding: 20px;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            animation: pulseText 1.5s ease-in-out infinite;
        }
        @keyframes pulseText {
            0%, 100% { opacity: 0.5; }
            50%      { opacity: 1; }
        }
        .lb-list .lb-empty {
            text-align: center;
            color: rgba(255, 220, 120, 0.9);
            padding: 20px;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        }
        .lb-list .lb-error {
            text-align: center;
            color: rgba(255, 150, 150, 0.95);
            padding: 20px;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        }

        /* ─── Records Button ────────────────────── */
        .btn-records {
            font-family: 'Grenze Gotisch', serif;
            padding: 10px 30px;
            font-size: 0.95rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 1.5px solid rgba(212, 175, 55, 0.55);
            border-radius: 30px;
            cursor: pointer;
            background: linear-gradient(135deg, rgba(74, 44, 109, 0.7), rgba(26, 10, 46, 0.6));
            backdrop-filter: blur(15px);
            color: rgba(255, 245, 220, 1);
            transition: all 0.3s ease;
            box-shadow: 0 4px 28px rgba(0, 0, 0, 0.4);
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.9);
            margin-top: 4px;
            flex-shrink: 0;
        }
        .btn-records:hover {
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: 0 6px 38px rgba(212, 175, 55, 0.3);
            transform: translateY(-1px);
        }
        .btn-records:active { transform: scale(0.95); }

        /* ─── Responsive Fit ────────────────────── */
        @media (max-width: 600px) {
            .game-wrapper { padding: 6px 12px 8px; gap: 6px; }
            .logo-slot { height: clamp(70px, 16dvh, 130px); width: min(100%, 420px); }
            .grid-frame {
                width: min(100%, 420px, 68dvh);
                padding: 12px;
                border-radius: 26px;
                max-height: 48dvh;
            }
            .card-grid { gap: 8px; }
            .info-item { padding: 5px 12px; gap: 4px; }
            .info-item .emoji-big { font-size: 1.2rem; }
            .info-item.top-scorer-item .emoji-big { font-size: 1.2rem; }
            .info-item .value { font-size: 1.1em; }
            .info-item.top-scorer-item .value { max-width: 100px; font-size: 1.05em; }
            .tracker-dot { width: 16px; height: 16px; }
            .round-tracker { gap: 5px; }
            .btn-records { padding: 8px 22px; font-size: 0.85rem; letter-spacing: 2px; }
            .lb-panel { padding: 20px 16px; }
            .win-message { font-size: 2.2rem; }
        }
        @media (max-width: 400px) {
            .info-item.round-item .value,
            .info-item.score-item .value { max-width: 60px; }
            .info-item.top-scorer-item .value { max-width: 70px; font-size: 0.95em; }
            .win-message { font-size: 1.8rem; }
        }
        @media (max-height: 700px) {
            .game-wrapper { gap: 5px; padding: 4px 16px 8px; }
            .logo-slot { height: clamp(60px, 14dvh, 120px); }
            .grid-frame {
                width: min(100%, 520px, 78dvh);
                max-height: 56dvh;
                padding: 12px;
            }
            .card-grid { gap: 8px; }
            .btn-records { padding: 8px 22px; font-size: 0.85rem; }
        }
        @media (max-height: 560px) {
            .game-wrapper { gap: 4px; }
            .logo-slot { height: clamp(50px, 13dvh, 100px); }
            .grid-frame {
                width: min(100%, 520px, 90dvh);
                max-height: 60dvh;
                padding: 10px;
            }
            .card-grid { gap: 6px; }
            .info-item { padding: 4px 10px; font-size: 0.75rem; }
            .info-item .emoji-big { font-size: 1rem; }
            .info-item .value { font-size: 1em; }
            .tracker-dot { width: 14px; height: 14px; border-width: 1.5px; }
            .btn-records { padding: 6px 18px; font-size: 0.75rem; }
            .round-tracker { margin-top: 2px; }
        }
    </style>
</head>
<body>
    <div class="bg-arcane"></div>
    <canvas id="magicCanvas"></canvas>

    <div id="introScreen" class="screen active">
        <div class="intro-container">
            <div class="intro-image-slot">
                <img class="intro-image"
                     src="https://i.postimg.cc/RCkvGRqY/Gato-mago-Chonk-Raid-(1).png"
                     alt="Chonk Raids — Wizard Cat"
                     width="400" height="400"
                     loading="eager" decoding="async" fetchpriority="high">
            </div>
            <div class="intro-loading-wrap">
                <div class="intro-loading-track"><div class="intro-loading-fill" id="introLoadingFill"></div></div>
                <div class="intro-loading-text" id="introLoadingText">Summoning 🪄 0%</div>
            </div>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <div class="game-wrapper">
            <div class="logo-slot">
                <img class="game-logo"
                     src="https://i.postimg.cc/prJkhvT8/Gato-mago-Chonk-Raid-(2)-(2).png"
                     alt="Chonk Raids"
                     width="500" height="170"
                     loading="eager" decoding="async" fetchpriority="high">
            </div>
            <div class="info-row">
                <div class="info-item round-item"><span class="emoji-big">🪄</span><span class="value" id="roundDisplay">1 / 10</span></div>
                <div class="info-item top-scorer-item"><span class="emoji-big">👑</span><span class="value" id="topScorerDisplay">---</span></div>
                <div class="info-item score-item"><span class="label" style="opacity:0.9;font-size:0.8em;font-weight:800;">✨</span><span class="value" id="scoreDisplay">0</span></div>
            </div>
            <div class="grid-frame">
                <div class="card-grid" id="cardGrid"></div>
                <div class="win-message" id="winMessage"></div>
            </div>
            <div class="round-tracker" id="roundTracker"></div>
            <button class="btn-records" id="recordsBtn">🏆 ARCANE LEGENDS</button>
        </div>
    </div>

    <div id="leaderboardOverlay">
        <div class="lb-panel">
            <button class="close-btn" id="lbCloseBtn">✕</button>
            <h2>🏆 ARCANE LEGENDS</h2>
            <ul class="lb-list" id="lbList"><li class="lb-loading">🔮 Consulting the oracle...</li></ul>
        </div>
    </div>

    <script>
        (function() {
            // ─── Arcane Particle Canvas ─────────────────
            const magicCanvas = document.getElementById('magicCanvas');
            const magicCtx = magicCanvas.getContext('2d');
            let magicW, magicH, particles = [];
            const PARTICLE_COLORS = ['#d4af37', '#9b59b6', '#ff8c00', '#ffd700', '#c39bd3'];

            function resizeMagic() {
                magicW = magicCanvas.width = innerWidth;
                magicH = magicCanvas.height = innerHeight;
            }
            function initMagic() {
                particles = [];
                for (let i = 0; i < 110; i++) {
                    particles.push({
                        x: Math.random() * magicW,
                        y: Math.random() * magicH,
                        r: Math.random() * 2.2 + 0.5,
                        speed: Math.random() * 0.7 + 0.25,
                        twinkle: Math.random() * Math.PI * 2,
                        twinkleSpeed: Math.random() * 0.035 + 0.012,
                        color: PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)],
                        baseOpacity: Math.random() * 0.5 + 0.35,
                        sway: Math.random() * 1.4 + 0.4,
                        swayPhase: Math.random() * Math.PI * 2,
                        swaySpeed: Math.random() * 0.018 + 0.005
                    });
                }
            }
            function drawMagic() {
                magicCtx.clearRect(0, 0, magicW, magicH);
                for (const p of particles) {
                    p.y -= p.speed;
                    p.twinkle += p.twinkleSpeed;
                    p.swayPhase += p.swaySpeed;
                    p.x += Math.sin(p.swayPhase) * p.sway * 0.5;

                    const twinkleAlpha = 0.5 + 0.5 * Math.sin(p.twinkle);
                    p.currentAlpha = p.baseOpacity * (0.4 + 0.6 * twinkleAlpha);

                    if (p.y < -15) { p.y = magicH + 15; p.x = Math.random() * magicW; }
                    if (p.x < -20) p.x = magicW + 20;
                    if (p.x > magicW + 20) p.x = -20;

                    magicCtx.globalAlpha = p.currentAlpha;
                    magicCtx.beginPath();
                    magicCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    magicCtx.fillStyle = p.color;
                    magicCtx.shadowColor = p.color;
                    magicCtx.shadowBlur = 10;
                    magicCtx.fill();
                }
                magicCtx.globalAlpha = 1;
                magicCtx.shadowBlur = 0;
                requestAnimationFrame(drawMagic);
            }
            window.addEventListener('resize', () => { resizeMagic(); initMagic(); });
            resizeMagic(); initMagic(); drawMagic();

            // ─── Intro Loading ──────────────────────────
            const introScreen = document.getElementById('introScreen'),
                gameScreen = document.getElementById('gameScreen');
            const introFill = document.getElementById('introLoadingFill'),
                introText = document.getElementById('introLoadingText');
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 2 + 0.8;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(() => {
                        introScreen.classList.remove('active');
                        gameScreen.classList.add('active');
                        initGame();
                    }, 300);
                }
                introFill.style.width = progress + '%';
                introText.textContent = `Summoning 🪄 ${Math.floor(progress)}%`;
            }, 80);

            // ─── Game Constants ─────────────────────────
            const IMAGES = {
                gold:  'https://i.postimg.cc/QVhLwdng/goldenpati.png',
                green: 'https://i.postimg.cc/9zC3KQN7/bluepati.png',
                red:   'https://i.postimg.cc/xqnrh1FM/redpati.png'
            };
            const POINTS = { gold: 1250, green: 750, red: 450 };
            const TYPE_COLOR = { gold: 'gold', green: 'arcane', red: 'crimson' };
            const TOTAL_ROUNDS = 10;

            // ─── 🌐 Supabase Leaderboard ─────────────────
            // Fill these two from: Supabase → Project Settings → API
            const SUPABASE_URL  = 'https://YOUR-PROJECT.supabase.co';
            const SUPABASE_ANON = 'eyJhbGciOi...YOUR-ANON-KEY...';

            async function sbFetch(path, options = {}) {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
                    ...options,
                    headers: {
                        'apikey': SUPABASE_ANON,
                        'Authorization': `Bearer ${SUPABASE_ANON}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation',
                        ...(options.headers || {})
                    }
                });
                if (!res.ok) throw new Error(`Supabase ${res.status}`);
                return res.json();
            }

            // ─── Game State ─────────────────────────────
            let grid = [], round = 1, totalScore = 0, roundActive = true, gameOver = false,
                roundResults = [], revealedCount = {}, isProcessing = false, goldStreak = 0;

            const cardGrid = document.getElementById('cardGrid'),
                roundDisplay = document.getElementById('roundDisplay'),
                scoreDisplay = document.getElementById('scoreDisplay'),
                topScorerDisplay = document.getElementById('topScorerDisplay'),
                roundTracker = document.getElementById('roundTracker'),
                winMessage = document.getElementById('winMessage'),
                lbOverlay = document.getElementById('leaderboardOverlay'),
                lbList = document.getElementById('lbList'),
                recordsBtn = document.getElementById('recordsBtn');

            function initGrid() {
                let types = [];
                for (let i = 0; i < 4; i++) types.push('gold', 'green', 'red');
                for (let i = types.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [types[i], types[j]] = [types[j], types[i]];
                }
                grid = types.map(type => ({ type, revealed: false }));
                revealedCount = { gold: 0, green: 0, red: 0 };
                roundActive = true;
                isProcessing = false;
            }

            function renderGrid() {
                cardGrid.innerHTML = '';
                grid.forEach((item, idx) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.dataset.index = idx;
                    card.dataset.type = item.type;

                    const inner = document.createElement('div');
                    inner.className = 'card-inner';

                    const front = document.createElement('div');
                    front.className = 'card-front';
                    const img = document.createElement('img');
                    img.src = IMAGES[item.type];
                    img.loading = 'eager';
                    img.decoding = 'async';
                    front.appendChild(img);

                    const back = document.createElement('div');
                    back.className = 'card-back';

                    inner.appendChild(front);
                    inner.appendChild(back);
                    card.appendChild(inner);

                    if (item.revealed) {
                        card.classList.add('flipped');
                        card.classList.add(TYPE_COLOR[item.type]);
                    }

                    card.addEventListener('click', () => handleCardClick(idx));
                    cardGrid.appendChild(card);
                });
            }

            function handleCardClick(index) {
                if (gameOver || !roundActive || isProcessing) return;
                const item = grid[index];
                if (item.revealed) return;

                item.revealed = true;
                revealedCount[item.type]++;

                const cardEl = cardGrid.children[index];
                cardEl.classList.add('flipped');
                cardEl.classList.add(TYPE_COLOR[item.type]);

                if (revealedCount[item.type] === 3) {
                    isProcessing = true;
                    roundActive = false;

                    let pointsEarned = POINTS[item.type];
                    let bonus = 0;

                    if (item.type === 'gold') {
                        goldStreak++;
                        if (goldStreak >= 2) {
                            bonus = (goldStreak - 1) * 250;
                            pointsEarned += bonus;
                        }
                    } else {
                        goldStreak = 0;
                    }

                    totalScore += pointsEarned;
                    updateHUD();
                    roundResults[round - 1] = item.type;
                    updateTracker();

                    grid.forEach((g, i) => {
                        if (g.type === item.type && g.revealed) {
                            const el = cardGrid.children[i];
                            el.classList.add('glow');
                            el.classList.add(TYPE_COLOR[item.type]);
                        }
                    });

                    let msgText = `+${pointsEarned}`;
                    if (bonus > 0) msgText += ` 🔥+${bonus}`;
                    winMessage.textContent = msgText;
                    winMessage.className = `win-message show ${TYPE_COLOR[item.type]}`;

                    setTimeout(() => {
                        winMessage.classList.remove('show', 'crimson', 'arcane', 'gold');
                        document.querySelectorAll('.card.glow').forEach(el =>
                            el.classList.remove('glow', 'crimson', 'arcane', 'gold'));
                        nextRound();
                    }, 1600);

                } else if (grid.every(g => g.revealed)) {
                    isProcessing = true;
                    roundActive = false;
                    goldStreak = 0;
                    roundResults[round - 1] = null;
                    updateTracker();
                    winMessage.textContent = '💨 Spell fizzled';
                    winMessage.className = 'win-message show arcane';
                    setTimeout(() => {
                        winMessage.classList.remove('show', 'arcane');
                        nextRound();
                    }, 1000);
                }
                updateHUD();
            }

            function nextRound() {
                round++;
                if (round > TOTAL_ROUNDS) { endGame(); return; }
                initGrid();
                renderGrid();
                updateHUD();
                updateTracker();
                isProcessing = false;
            }

            function endGame() {
                gameOver = true;
                roundActive = false;
                const finalScore = totalScore;

                winMessage.textContent = `🏆 ${finalScore.toLocaleString()} pts!`;
                winMessage.className = 'win-message show gold';

                setTimeout(() => {
                    winMessage.classList.remove('show', 'gold');
                    round = 1;
                    totalScore = 0;
                    goldStreak = 0;
                    roundResults = [];
                    gameOver = false;
                    initGrid();
                    renderGrid();
                    updateHUD();
                    updateTracker();

                    const name = prompt(
                        `🏆 Final Score: ${finalScore.toLocaleString()} points!\n\nEnter your wizard name for the leaderboard:`,
                        'Player'
                    );
                    if (name && name.trim()) {
                        addScoreToSheet(name.trim(), finalScore);
                    }
                }, 1800);
            }

            function updateHUD() {
                roundDisplay.textContent = `${Math.min(round, TOTAL_ROUNDS)} / ${TOTAL_ROUNDS}`;
                scoreDisplay.textContent = totalScore;
            }

            function updateTracker() {
                roundTracker.innerHTML = '';
                for (let i = 0; i < TOTAL_ROUNDS; i++) {
                    const dot = document.createElement('span');
                    dot.className = 'tracker-dot';
                    if (i < roundResults.length) {
                        const res = roundResults[i];
                        if (res === 'gold') dot.classList.add('active-gold');
                        else if (res === 'green') dot.classList.add('active-arcane');
                        else if (res === 'red') dot.classList.add('active-crimson');
                        else dot.classList.add('neutral');
                    }
                    if (i === round - 1 && !gameOver) dot.classList.add('current');
                    roundTracker.appendChild(dot);
                }
            }

            function initGame() {
                round = 1;
                totalScore = 0;
                gameOver = false;
                goldStreak = 0;
                roundResults = [];
                initGrid();
                renderGrid();
                updateHUD();
                updateTracker();
                fetchLeaderboard();
            }

            // ─── 📊 Leaderboard (Supabase) ──────────────
            async function addScoreToSheet(name, score) {
                lbList.innerHTML = '<li class="lb-loading">🔮 Inscribing your name...</li>';
                lbOverlay.classList.add('open');
                try {
                    await sbFetch('scores', {
                        method: 'POST',
                        body: JSON.stringify({ name, score })
                    });
                    await fetchLeaderboard();
                } catch (err) {
                    lbList.innerHTML = '<li class="lb-error">🔮 The oracle rejected your offering...</li>';
                }
            }

            async function fetchLeaderboard() {
                lbList.innerHTML = '<li class="lb-loading">🔮 Consulting the oracle...</li>';
                try {
                    const entries = await sbFetch(
                        'scores?select=name,score&order=score.desc,created_at.asc&limit=10'
                    );
                    renderLeaderboard(entries);
                } catch (err) {
                    lbList.innerHTML = '<li class="lb-error">🔮 The oracle is silent...</li>';
                    updateTopScorerDisplay(null);
                }
            }

            function renderLeaderboard(entries) {
                lbList.innerHTML = '';
                if (!entries.length) {
                    lbList.innerHTML = '<li class="lb-empty">No legends yet. Be the first! 🔮</li>';
                    updateTopScorerDisplay(null);
                    return;
                }
                updateTopScorerDisplay(entries[0].name);
                entries.forEach((entry, idx) => {
                    const li = document.createElement('li');
                    let rankClass = 'rank-other';
                    let medal = '🔹';
                    if (idx === 0) { rankClass = 'rank-1'; medal = '🥇'; }
                    else if (idx === 1) { rankClass = 'rank-2'; medal = '🥈'; }
                    else if (idx === 2) { rankClass = 'rank-3'; medal = '🥉'; }
                    li.className = rankClass;
                    li.innerHTML =
                        `<span class="medal">${medal}</span>` +
                        `<span class="name">${escapeHtml(entry.name)}</span>` +
                        `<span class="score">${Number(entry.score).toLocaleString()}</span>`;
                    lbList.appendChild(li);
                });
            }

            function updateTopScorerDisplay(name) {
                topScorerDisplay.textContent = name || '---';
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            recordsBtn.addEventListener('click', () => {
                lbOverlay.classList.add('open');
                fetchLeaderboard();
            });
            document.getElementById('lbCloseBtn').addEventListener('click', () =>
                lbOverlay.classList.remove('open'));
            lbOverlay.addEventListener('click', (e) => {
                if (e.target === lbOverlay) lbOverlay.classList.remove('open');
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') {
                    round = 1;
                    totalScore = 0;
                    gameOver = false;
                    goldStreak = 0;
                    roundResults = [];
                    initGrid();
                    renderGrid();
                    updateHUD();
                    updateTracker();
                    winMessage.classList.remove('show', 'crimson', 'arcane', 'gold');
                    winMessage.textContent = '';
                }
                if (e.key === 'Escape') lbOverlay.classList.remove('open');
            });

            setInterval(fetchLeaderboard, 30000);
            fetchLeaderboard();
        })();
    </script>
</body>
</html>
